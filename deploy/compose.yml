name: agentoa
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}
services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
    environment:
      MYSQL_ROOT_PASSWORD_FILE: /run/secrets/mysql-root-password
      MYSQL_DATABASE: agentoa
    secrets: [mysql-root-password, db-password, migration-password, backup-password]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sh:/docker-entrypoint-initdb.d/10-agentoa.sh:ro
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports: ["127.0.0.1:13306:3306"]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$(cat /run/secrets/mysql-root-password) mysql -uroot -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 40
    restart: unless-stopped
    logging: *logging
  redis:
    image: public.ecr.aws/docker/library/redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
    entrypoint: ["/bin/sh", "-ec"]
    command: ["exec redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction --requirepass \"$$(cat /run/secrets/redis-password)\""]
    secrets: [redis-password]
    volumes: ["redis-data:/data"]
    ports: ["127.0.0.1:16379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis-password) redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging
  storage:
    # SeaweedFS 4.48, official maintainer image, immutable digest.
    image: ghcr.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command: ["server", "-dir=/data", "-ip=storage", "-s3", "-s3.config=/run/secrets/s3-config", "-master.volumeSizeLimitMB=1024", "-volume.max=10"]
    secrets: [s3-config]
    volumes: ["storage-data:/data"]
    ports: ["127.0.0.1:19000:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://storage:8888/ && nc -z storage 8333 && nc -z storage 18888"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s
    restart: unless-stopped
    logging: *logging
  storage-init:
    image: ghcr.io/chrislusf/seaweedfs@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    depends_on:
      storage: {condition: service_healthy}
    entrypoint: ["/bin/sh", "-ec"]
    command: ["if wget -q -O /dev/null http://storage:8888/buckets/agentoa/; then exit 0; fi; printf 's3.bucket.create -name agentoa\n' | weed shell -master=storage:9333 -filer=storage:8888"]
    restart: "no"
  migrate:
    image: agentoa/backend:0.1.0
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    command: ["--migrate"]
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
    secrets: [migration-password]
    depends_on:
      mysql: {condition: service_healthy}
    restart: "no"
  backend:
    image: agentoa/backend:0.1.0
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: agentoa
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: http://storage:8333
      CAPTCHA_ENABLED: ${CAPTCHA_ENABLED:-true}
      WS_ALLOWED_ORIGINS: ${WS_ALLOWED_ORIGINS:-http://localhost:18080,http://localhost:18082,http://localhost:5173}
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=70 -Duser.timezone=UTC
    secrets: [db-password, redis-password, s3-access-key, s3-secret-key, bootstrap-password]
    depends_on:
      migrate: {condition: service_completed_successfully}
      storage-init: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    ports: ["127.0.0.1:18081:8080"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 90s
    restart: unless-stopped
    logging: *logging
  web:
    image: agentoa/web:0.1.0
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports: ["127.0.0.1:18080:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
  h5:
    image: agentoa/h5:0.1.0
    build:
      context: ..
      dockerfile: deploy/h5.Dockerfile
    ports: ["127.0.0.1:18082:8080"]
    depends_on:
      backend: {condition: service_healthy}
    restart: unless-stopped
    logging: *logging
volumes:
  mysql-data:
  redis-data:
  storage-data:
secrets:
  mysql-root-password: {file: ./secrets/mysql-root-password}
  db-password: {file: ./secrets/db-password}
  migration-password: {file: ./secrets/migration-password}
  backup-password: {file: ./secrets/backup-password}
  redis-password: {file: ./secrets/redis-password}
  s3-access-key: {file: ./secrets/s3-access-key}
  s3-secret-key: {file: ./secrets/s3-secret-key}
  bootstrap-password: {file: ./secrets/bootstrap-password}
  s3-config: {file: ./secrets/s3-config}
