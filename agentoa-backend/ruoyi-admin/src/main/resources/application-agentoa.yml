server:
  port: ${SERVER_PORT:8080}
  undertow:
    max-http-post-size: 21MB
logging:
  level:
    org.dromara: info
    org.flowable: info
    org.springframework: warn
    org.dromara.common.web.interceptor.PlusWebInvokeTimeInterceptor: warn
spring:
  application:
    name: AgentOA
  config:
    import: optional:configtree:/run/secrets/
  datasource:
    dynamic:
      primary: master
      strict: true
      p6spy: false
      datasource:
        master:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:13306}/agentoa?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&useSSL=false&allowPublicKeyRetrieval=true
          username: ${DB_USER:agentoa}
          password: ${db-password:${DB_PASSWORD:}}
      hikari:
        max-pool-size: 15
        min-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:16379}
      password: ${redis-password:${REDIS_PASSWORD:}}
      database: 0
      timeout: 5s
  flyway:
    enabled: ${MIGRATIONS_ENABLED:false}
    url: ${spring.datasource.dynamic.datasource.master.url}
    user: ${MIGRATION_USER:agentoa_migrate}
    password: ${migration-password:${MIGRATION_PASSWORD:}}
    baseline-on-migrate: false
    clean-disabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    time-zone: UTC
  boot:
    admin:
      client:
        enabled: false
        username: monitor
        password: ${monitor-password:${MONITOR_PASSWORD:disabled}}
redisson:
  keyPrefix: 'agentoa:'
  threads: 4
  nettyThreads: 4
  singleServerConfig:
    clientName: AgentOA
    connectionMinimumIdleSize: 2
    connectionPoolSize: 16
    subscriptionConnectionPoolSize: 8
    idleConnectionTimeout: 10000
    timeout: 3000
sa-token:
  timeout: 7200
  active-timeout: 1800
  token-style: random-64
  is-read-body: false
  is-read-cookie: false
  token-prefix: Bearer
tenant:
  enable: false
api-decrypt:
  enabled: false
captcha:
  enable: ${CAPTCHA_ENABLED:true}
snail-job:
  enabled: false
sse:
  enabled: false
websocket:
  enabled: false
mail:
  enabled: false
sms:
  config-type: yaml
  blends: {}
justauth:
  enabled: false
  address: http://localhost
  type: {}
flowable:
  database-schema-update: ${FLOWABLE_SCHEMA_UPDATE:false}
  async-executor-activate: false
  check-process-definitions: false
  idm:
    enabled: false
  eventregistry:
    enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
security:
  excludes:
    - /error
    - /favicon.ico
    - /actuator/health
    - /actuator/health/**
    - /ws
agentoa:
  bootstrap-password: ${bootstrap-password:${BOOTSTRAP_PASSWORD:}}
  storage:
    endpoint: ${S3_ENDPOINT:http://localhost:19000}
    bucket: agentoa
    access-key: ${s3-access-key:${S3_ACCESS_KEY:}}
    secret-key: ${s3-secret-key:${S3_SECRET_KEY:}}
  websocket:
    allowed-origins: ${WS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:18080}
